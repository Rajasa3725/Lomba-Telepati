[project]
name = "lomba"
version = "0.1.0"
description = "Lomba Agridata Telepati 8.0"
readme = "README.md"
authors = [
    { name = "Ihsan Aliyandi", email = "aliyandiihsan2@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "albumentations>=2.0.8",
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.2",
    "nbformat>=5.11.1",
    "numpy>=2.5.3",
    "opencv-python>=5.0.0.93",
    "pandas>=3.0.5",
    "pillow>=12.3.0",
    "ultralytics>=8.4.154",
]

[project.scripts]
lomba = "lomba:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
